name: Penguint
description: PenguinT (penguin.travel) is a licensed Thai travel agency and tour operator
  (registration 11/08856) specializing in online flight search and booking for domestic
  and international routes. The consumer-facing site lets travelers compare round-trip and
  one-way fares across major carriers such as Thai Airways, Emirates, and Qatar Airways,
  in cabin classes from economy through first, departing from Bangkok, Chiang Mai, Phuket
  and other Thai cities. It was surfaced as a 500 Global portfolio company and added to the
  API Evangelist network. As of this enrichment pass the company publishes no public API,
  developer portal, or programmatic booking surface.
